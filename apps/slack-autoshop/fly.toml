# Fly.io config for the slack-autoshop app.
# Run `fly launch --no-deploy` once to claim a name and write the [build]/app
# fields; then `fly volumes create data --size 1` and `fly deploy`.

app = "make-nashville-autoshop"
primary_region = "ord"

[build]

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/autoshop.db"
  TZ = "America/Chicago"
  NODE_ENV = "production"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[checks]
  [checks.healthz]
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
